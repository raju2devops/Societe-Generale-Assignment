# =============================================================================
# nginx configuration for the SPA container.
#
# This is where the authoritative security headers are set. A <meta> CSP cannot
# express frame-ancestors and is trivially stripped, so the header wins.
# OWASP A02:2025 Security Misconfiguration.
# =============================================================================

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Do not advertise the server version (A02:2025).
    server_tokens off;

    # ---- Security headers ---------------------------------------------------
    # `connect-src 'self'` means the SPA can only call its own origin - the API
    # is reverse-proxied under /api, so no third-party endpoint is reachable
    # even if an injected script tried.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # HSTS is deliberately NOT set here. This container is served over plain
    # HTTP locally; HSTS belongs on whatever terminates TLS in front of it, and
    # emitting it from an HTTP origin would be misleading (browsers ignore it
    # over HTTP anyway). Add it at the TLS terminator when you deploy.

    # ---- Hardening ----------------------------------------------------------
    client_max_body_size 64k;
    client_body_timeout  10s;
    client_header_timeout 10s;

    # Block dotfiles and source maps outright.
    location ~ /\. { deny all; return 404; }
    location ~ \.map$ { deny all; return 404; }

    # ---- API reverse proxy --------------------------------------------------
    # Serving the SPA and the API from ONE origin keeps the auth cookies
    # same-site and removes the need for any CORS relaxation in production.
    location /api/ {
        proxy_pass         http://sg-bank-api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Never let a proxy or CDN cache an authenticated API response.
        proxy_no_cache     1;
        proxy_cache_bypass 1;
    }

    # ---- Static assets ------------------------------------------------------
    # Vite emits content-hashed filenames, so they are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The HTML shell must never be cached, or a deploy leaves clients pinned to
    # a stale bundle referencing assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
