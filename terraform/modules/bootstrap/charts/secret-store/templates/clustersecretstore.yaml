apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.name }}
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ .Values.vaultUrl | quote }}
      serviceAccountRef:
        name: {{ .Values.serviceAccount.name }}
        namespace: {{ .Values.serviceAccount.namespace }}
