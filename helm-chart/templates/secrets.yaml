{{- if .Values.secretEnvVar }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.release }}-ext-secret                                    
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store
  target:
    name: {{ .Values.release }}-secret
    creationPolicy: Owner
  data:
  {{ range $key, $value := .Values.secretEnvVar }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ $value }}
  {{- end }}
{{- end }}
{{- if and .Values.seed.enabled .Values.seed.secretEnvVar }}
---
# Bootstrap credentials for the post-install seed Job, deliberately a separate
# Secret from the one above. Only templates/seed-job.yaml mounts it, so the
# long-running application never carries the bootstrap password in its
# environment - which is what scripts/seed-admin.js asks for.
#
# A plain resource, not a hook: Helm creates it before post-install hooks run,
# giving External Secrets the whole install to materialise it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.release }}-seed-ext-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store
  target:
    name: {{ .Values.release }}-seed-secret
    creationPolicy: Owner
  data:
  {{- range $key, $value := .Values.seed.secretEnvVar }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ $value }}
  {{- end }}
{{- end }}