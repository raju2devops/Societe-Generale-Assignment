# =============================================================================
# SonarQube Cloud analysis.
#
# One project covering both tiers. The scanner runs from the repository root,
# which is why the coverage report needs its paths rebased in CI - see the
# "Rebase coverage paths" step in .github/workflows/build-and-push.yml.
#
# Setup, once:
#   1. Import the repository at https://sonarcloud.io
#   2. Copy the organization key it shows into sonar.organization below
#   3. Add the generated token as the repository secret SONAR_TOKEN
#   4. Administration -> Analysis Method -> turn OFF Automatic Analysis.
#      Leaving it on conflicts with CI-based analysis and the scan fails.
#
# Until SONAR_TOKEN exists the workflow skips the scan rather than failing.
# =============================================================================

sonar.projectKey=raju2devops_SC-Assignment
# TODO: replace with the organization key from SonarCloud (often the GitHub
# login, but confirm - a wrong value fails with "project not found").
sonar.organization=raju2devops

sonar.projectName=SC-Assignment
sonar.sources=apps/backend/src,apps/frontend/src
sonar.tests=apps/backend/tests

# Backend only: the frontend has no test script, so its files legitimately
# report zero coverage and pull the project number below the backend's own.
sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.sourceEncoding=UTF-8
